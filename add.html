<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Plant</title>
</head>

<body>

    <header>
        <h1>Leafwise Plant Care</h1>
    </header>

    <nav>
        <a href="index.html">The garden</a> |
        <a href="add.html">Add a plant</a>
    </nav>

    <section>

        <h2>Share your plant</h2>

        <p>
            Have a plant you love? Upload a photo and share your care
            knowledge with the community.
        </p>

        <h3>PLANT PHOTO</h3>

        <input type="file" accept=".jpg,.jpeg,.png,.webp">

        <p>Click to upload a photo</p>
        <p>JPG, PNG, WEBP accepted</p>

        <br>

        <label>PLANT NAME</label>
        <br>
        <input type="text" placeholder="e.g. Monstera">

        <br><br>

        <label>SCIENTIFIC NAME</label>
        <br>
        <input type="text" placeholder="e.g. Monstera deliciosa">

        <br><br>

        <label>DIFFICULTY</label>
        <br>
        <select>
            <option>Easy</option>
            <option>Medium</option>
            <option>Hard</option>
        </select>

        <br><br>

        <label>LIGHT</label>
        <br>
        <input type="text" placeholder="Bright indirect">

        <br><br>

        <label>WATERING</label>
        <br>
        <input type="text" placeholder="Every 2 weeks">

        <br><br>

        <label>HUMIDITY</label>
        <br>
        <input type="text" placeholder="60%+">

        <br><br>

        <label>TEMPERATURE</label>
        <br>
        <input type="text" placeholder="18–27°C">

        <br><br>

        <label>TOXICITY</label>
        <br>
        <input type="text" placeholder="e.g. Pet safe">

        <br><br>

        <label>DESCRIPTION</label>
        <br>
        <textarea rows="4" cols="60"
            placeholder="Share what makes this plant special..."></textarea>

        <br><br>

        <label>CARE TIPS (one per line)</label>
        <br>
        <textarea rows="5" cols="60"
            placeholder="Water when top 2 inches are dry
Avoid direct afternoon sun
Propagates easily in water"></textarea>

        <br><br>

        <button>Add to the garden →</button>

    </section>

    <footer>
        <p>Leafwise &copy; A community plant care encyclopedia.</p>
    </footer>

</body>

</html>
